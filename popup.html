<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrome Request Mocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="topline">
        <strong>Chrome Request Mocker</strong>
        <div class="actions">
          <button id="sync" type="button" hidden>Sync</button>
          <button id="settings" type="button" aria-label="Settings">⚙</button>
        </div>
      </div>
      <div id="sync-status" class="sync-status" role="status" aria-live="polite" hidden></div>
    </header>
    <div id="last-sync">Last sync: Never</div>
    <div id="configs"></div>
    <p id="status" class="status"></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
